apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: vault-bank
  name: grafana
  namespace: vault-bank-staging
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: vault-bank
    spec:
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: grafana-admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: grafana-admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        image: grafana/grafana:12.4.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: grafana
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 50m
            memory: 128Mi
          requests:
            cpu: 15m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasource
          readOnly: true
        - mountPath: /etc/grafana/provisioning/dashboards
          name: dashboard-provider
          readOnly: true
        - mountPath: /etc/grafana/provisioned-dashboards
          name: dashboard
          readOnly: true
        - mountPath: /var/lib/grafana
          name: data
        - name: grafana-tmp
          mountPath: /tmp
        - name: grafana-logs
          mountPath: /var/log/grafana
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 472
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: grafana-datasource
        name: datasource
      - configMap:
          defaultMode: 420
          name: grafana-dashboard-provider
        name: dashboard-provider
      - configMap:
          defaultMode: 420
          name: vaultbank-grafana-dashboard
        name: dashboard
      - emptyDir: {}
        name: data
      - name: grafana-tmp
        emptyDir: {}
      - name: grafana-logs
        emptyDir: {}
