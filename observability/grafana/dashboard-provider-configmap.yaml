apiVersion: v1
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: Vault Bank
        orgId: 1
        folder: Vault Bank
        folderUid: vault-bank
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false

        options:
          path: /etc/grafana/provisioned-dashboards
          foldersFromFilesStructure: false
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: vault-bank-staging
